<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Zentra - Mobile Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#899ca5",
                        "surface-tint": "#3c5d9c",
                        "on-secondary-container": "#003558",
                        "on-error": "#ffffff",

                        "on-primary-fixed": "#001a42",
                        "primary-container": "#002f6c",
                        "secondary-fixed": "#cfe5ff",
                        "tertiary": "#0c1f25",
                        "outline-variant": "#c4c6d2",
                        "primary-fixed": "#d8e2ff",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#d2e6ef",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#004a77",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-surface": "#191c1e",
                        "surface-variant": "#e0e3e5",
                        "surface-container": "#eceef0",
                        "surface-dim": "#d8dadc",
                        "tertiary-fixed-dim": "#b6cad2",
                        "on-surface-variant": "#434750",
                        "primary": "#001b44",
                        "surface": "#f7f9fb",
                        "secondary": "#00629d",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "secondary-container": "#00a2fd",
                        "surface-container-highest": "#e0e3e5",
                        "on-background": "#191c1e",
                        "surface-container-high": "#e6e8ea",
                        "outline": "#747781",
                        "inverse-surface": "#2d3133",
                        "inverse-on-surface": "#eff1f3",
                        "surface-bright": "#f7f9fb",
                        "on-tertiary-fixed": "#0b1e24",
                        "background": "#f7f9fb",
                        "on-primary-fixed-variant": "#224583",
                        "surface-container-low": "#f2f4f6",
                        "tertiary-container": "#22343b",
                        "on-secondary-fixed": "#001d33",
                        "primary-fixed-dim": "#aec6ff",
                        "secondary-fixed-dim": "#98cbff",
                        "on-primary-container": "#7999dc",
                        "on-tertiary-fixed-variant": "#374951"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "margin-mobile": "20px",
                        "xl": "32px",
                        "lg": "24px",
                        "md": "16px",
                        "xs": "4px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-sm": ["Inter"],

                    },
                    "fontSize": {
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500"}],
                        "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "otp-input": ["28px", {"lineHeight": "36px", "letterSpacing": "0.2em", "fontWeight": "700"}],
                        "display": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.5);
            box-shadow: 0 4px 20px rgba(0, 47, 108, 0.05);
        }
        
        .primary-btn {
            background-color: #002F6C;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="bg-surface min-h-screen flex flex-col antialiased text-on-surface selection:bg-primary-container selection:text-on-primary-container relative overflow-hidden">
<!-- Atmospheric Background Elements -->
<div class="absolute top-0 right-0 w-96 h-96 bg-primary-fixed-dim/20 rounded-full blur-[100px] -translate-y-1/2 translate-x-1/3 pointer-events-none z-0"></div>
<div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-secondary-fixed-dim/10 rounded-full blur-[120px] translate-y-1/3 -translate-x-1/4 pointer-events-none z-0"></div>
<!-- Main Content Canvas (Linear/Transactional - No Nav Shell) -->
<main class="flex-1 flex flex-col px-margin-mobile relative z-10 w-full max-w-md mx-auto">
<!-- Header Section -->
<header class="pt-20 pb-lg">
<h1 class="font-display text-display text-primary mb-sm tracking-tight">Zentra</h1>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Welcome to Zentra</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Enter your registered mobile number to continue.</p>
</header>
<!-- Form Section (Bento/Glassmorphism approach) -->
<section class="flex-1 flex flex-col gap-lg">
<div class="glass-panel rounded-xl p-md flex flex-col gap-sm relative overflow-hidden">
<!-- Decorative top border accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary-container to-secondary-container"></div>
<label class="font-label-lg text-label-lg text-on-surface-variant flex items-center gap-2" for="mobile-number">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">smartphone</span>
                    Mobile Number
                </label>
<div class="flex items-stretch bg-surface-container-lowest rounded-lg border border-outline-variant focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all duration-200 group">
<!-- Country Selector (Static for design) -->
<button class="flex items-center gap-2 px-md py-sm border-r border-outline-variant bg-surface-container-low/50 hover:bg-surface-container-low transition-colors rounded-l-lg text-on-surface" type="button">
<img alt="India Flag" class="w-6 h-4 object-cover rounded-sm border border-outline/10" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD7vBIUaJIoUBVeIiBu4cjNsGWFA_3QbABIv4P4z6bpOAKpEhNUBop6gz2p2HkF1FhbWRr1-Rt4I3Iwd7GAUA7i7347LEesZIFuKHRgUSW0ky6MDcLmOmaPLgWeEXihM7EcszLgw-6aVBqbnKJf2ZnfSzjt76-Bkfdb3at9nHI4xURPrYZpR0U_NBI20BjJLl_3A7SAd7uzTYtiTtHwQVWOgjdLqoJJCffFMDaj67axUsxhesyDQhyl"/>
<span class="font-body-lg text-body-lg font-medium">+91</span>
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" style="font-variation-settings: 'FILL' 0;">expand_more</span>
</button>
<!-- Number Input -->
<input autocomplete="tel-national" class="flex-1 bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 px-md py-sm w-full tracking-wide" id="mobile-number" pattern="[0-9]{10}" placeholder="00000 00000" type="tel"/>
</div>
<!-- Security Note -->
<div class="flex items-center gap-2 mt-2 px-1">
<span class="material-symbols-outlined text-[16px] text-primary-container" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">We'll send a secure 6-digit OTP to verify.</p>
</div>
</div>
<!-- Trust Indicators -->
<div class="flex justify-center gap-xl opacity-60">
<div class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 0;">encrypted</span>
<span class="font-label-sm text-label-sm text-center">256-bit<br/>Encryption</span>
</div>
<div class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 0;">verified_user</span>
<span class="font-label-sm text-label-sm text-center">Identity<br/>Protected</span>
</div>
</div>
</section>
<!-- Footer / Action Area -->
<footer class="pb-safe pt-lg pb-xl mt-auto">
<button class="primary-btn w-full h-14 rounded-lg flex items-center justify-center gap-2 text-on-primary font-label-lg text-label-lg hover:opacity-90 active:scale-[0.98] transition-all duration-200">
                Continue
                <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
<p class="text-center font-label-sm text-label-sm text-on-surface-variant mt-md px-4">
                By continuing, you agree to Zentra's 
                <a class="text-primary-container font-medium hover:underline" href="#">Terms of Service</a> and 
                <a class="text-primary-container font-medium hover:underline" href="#">Privacy Policy</a>.
            </p>
</footer>
</main>
<script>
        // Simple micro-interaction for the input field spacing
        const input = document.getElementById('mobile-number');
        input.addEventListener('input', function(e) {
            let val = this.value.replace(/\D/g, ''); // Remove non-digits
            if (val.length > 5) {
                // Add space after 5 digits for readability common in Indian numbers (xxxxx xxxxx)
                val = val.substring(0, 5) + ' ' + val.substring(5, 10);
            }
            this.value = val;
        });
    </script>
</body></html>
