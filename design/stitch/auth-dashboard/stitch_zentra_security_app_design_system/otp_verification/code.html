<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Zentra - Verify Your Number</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

              "colors": {

                      "on-error": "#ffffff",
                      "inverse-primary": "#aec6ff",
                      "on-primary-fixed": "#001a42",
                      "primary-container": "#002f6c",
                      "secondary-fixed": "#cfe5ff",
                      "tertiary": "#0c1f25",
                      "outline-variant": "#c4c6d2",
                      "primary-fixed": "#d8e2ff",
                      "on-tertiary": "#ffffff",
                      "tertiary-fixed": "#d2e6ef",
                      "on-secondary": "#ffffff",
                      "on-secondary-fixed-variant": "#004a77",
                      "on-primary": "#ffffff",
                      "on-error-container": "#93000a",
                      "on-surface": "#191c1e",
                      "surface-variant": "#e0e3e5",
                      "surface-container": "#eceef0",
                      "surface-dim": "#d8dadc",
                      "tertiary-fixed-dim": "#b6cad2",
                      "on-surface-variant": "#434750",
                      "primary": "#001b44",
                      "surface": "#f7f9fb",
                      "secondary": "#00629d",
                      "error-container": "#ffdad6",
                      "surface-container-lowest": "#ffffff",
                      "error": "#ba1a1a",
                      "secondary-container": "#00a2fd",
                      "surface-container-highest": "#e0e3e5",
                      "on-background": "#191c1e",
                      "surface-container-high": "#e6e8ea",
                      "outline": "#747781",
                      "inverse-surface": "#2d3133",
                      "inverse-on-surface": "#eff1f3",
                      "surface-bright": "#f7f9fb",
                      "on-tertiary-fixed": "#0b1e24",
                      "background": "#f7f9fb",
                      "on-primary-fixed-variant": "#224583",
                      "surface-container-low": "#f2f4f6",
                      "tertiary-container": "#22343b",
                      "on-secondary-fixed": "#001d33",
                      "primary-fixed-dim": "#aec6ff",
                      "secondary-fixed-dim": "#98cbff",
                      "on-primary-container": "#7999dc",
                      "on-tertiary-fixed-variant": "#374951"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "16px",
                      "margin-mobile": "20px",
                      "xl": "32px",
                      "lg": "24px",
                      "md": "16px",
                      "xs": "4px",
                      "sm": "8px"
              },
              "fontFamily": {
                      "body-lg": ["Inter"],
                      "headline-lg": ["Inter"],
                      "label-sm": ["Inter"],
                      "label-lg": ["Inter"],
                      "headline-md": ["Inter"],
                      "body-md": ["Inter"],
                      "otp-input": ["Inter"],
                      "display": ["Inter"]
              },
              "fontSize": {
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500"}],
                      "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "otp-input": ["28px", {"lineHeight": "36px", "letterSpacing": "0.2em", "fontWeight": "700"}],
                      "display": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
              }
            },
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Glassmorphic Utilities */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 47, 108, 0.1);
        }
        
        /* Custom OTP Input Focus */
        .otp-input-field:focus {
            outline: none;
            border-color: transparent;
            border-bottom: 2px solid #002f6c;
            box-shadow: none;
        }
    </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Transactional Screen - No Nav Shells -->
<main class="w-full max-w-md mx-auto flex flex-col items-center relative z-10">
<!-- Icon Header -->
<div class="mb-lg flex justify-center items-center w-16 h-16 rounded-full bg-surface-container-low shadow-[0_4px_20px_rgba(0,47,108,0.05)] border border-outline-variant/30">
<span class="material-symbols-outlined text-primary-container text-[32px]" data-icon="lock_outline">lock_outline</span>
</div>
<!-- Headline & Context -->
<div class="text-center mb-xl w-full">
<h1 class="font-headline-lg text-headline-lg text-primary mb-sm">Verify Your Number</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-xs">We've sent a secure verification code to</p>
<div class="inline-flex items-center gap-xs px-3 py-1 bg-surface-container rounded-full border border-outline-variant/30">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]" data-icon="smartphone">smartphone</span>
<span class="font-label-lg text-label-lg text-primary">+91 XXXXX X1234</span>
</div>
</div>
<!-- OTP Input Section -->
<div class="w-full bg-surface rounded-xl shadow-[0_4px_20px_rgba(0,47,108,0.05)] border border-surface-variant p-lg mb-lg">
<form class="flex flex-col items-center" id="otpForm">
<div class="flex gap-2 mb-lg justify-center w-full">
<!-- OTP Inputs -->
<input aria-label="Digit 1" class="otp-input-field w-12 h-14 text-center font-otp-input text-otp-input text-primary bg-surface-container-lowest border-t-0 border-l-0 border-r-0 border-b-2 border-outline-variant/50 rounded-t-md transition-colors" maxlength="1" type="text"/>
<input aria-label="Digit 2" class="otp-input-field w-12 h-14 text-center font-otp-input text-otp-input text-primary bg-surface-container-lowest border-t-0 border-l-0 border-r-0 border-b-2 border-outline-variant/50 rounded-t-md transition-colors" maxlength="1" type="text"/>
<input aria-label="Digit 3" class="otp-input-field w-12 h-14 text-center font-otp-input text-otp-input text-primary bg-surface-container-lowest border-t-0 border-l-0 border-r-0 border-b-2 border-outline-variant/50 rounded-t-md transition-colors" maxlength="1" type="text"/>
<input aria-label="Digit 4" class="otp-input-field w-12 h-14 text-center font-otp-input text-otp-input text-primary bg-surface-container-lowest border-t-0 border-l-0 border-r-0 border-b-2 border-outline-variant/50 rounded-t-md transition-colors" maxlength="1" type="text"/>
<input aria-label="Digit 5" class="otp-input-field w-12 h-14 text-center font-otp-input text-otp-input text-primary bg-surface-container-lowest border-t-0 border-l-0 border-r-0 border-b-2 border-outline-variant/50 rounded-t-md transition-colors" maxlength="1" type="text"/>
<input aria-label="Digit 6" class="otp-input-field w-12 h-14 text-center font-otp-input text-otp-input text-primary bg-surface-container-lowest border-t-0 border-l-0 border-r-0 border-b-2 border-outline-variant/50 rounded-t-md transition-colors" maxlength="1" type="text"/>
</div>
<!-- Demo Notice (Glassmorphic) -->
<div class="glass-card rounded-md px-4 py-2 flex items-center gap-2 mb-lg w-full max-w-[280px]">
<span class="material-symbols-outlined text-secondary text-[16px]" data-icon="info">info</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Demo verification code: <strong class="text-primary font-bold">123456</strong></span>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary font-label-lg text-label-lg h-12 rounded-full flex items-center justify-center gap-2 shadow-[inset_0_1px_1px_rgba(255,255,255,0.2)] hover:bg-primary transition-colors active:scale-[0.98]" type="button">
<span>Verify OTP</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</div>
<!-- Secondary Actions -->
<div class="flex flex-col items-center gap-sm w-full">
<div class="flex items-center gap-1">
<span class="font-body-md text-body-md text-on-surface-variant">Didn't receive the code?</span>
<span class="font-label-sm text-label-sm text-primary" id="countdown">00:30</span>
</div>
<div class="flex gap-lg mt-xs">
<button class="font-label-lg text-label-lg text-secondary hover:text-primary transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled="" id="resendBtn">
                    Resend OTP
                </button>
<div class="w-[1px] h-4 bg-outline-variant/50 self-center"></div>
<button class="font-label-lg text-label-lg text-on-surface-variant hover:text-primary transition-colors">
                    Change Number
                </button>
</div>
</div>
</main>
<script>
        // Simple OTP Input Logic
        const inputs = document.querySelectorAll('.otp-input-field');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Ensure only numbers
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
            
            // Auto focus first input on load
            if(index === 0) {
                setTimeout(() => input.focus(), 100);
            }
        });

        // Simple Countdown Logic
        let timeLeft = 30;
        const countdownEl = document.getElementById('countdown');
        const resendBtn = document.getElementById('resendBtn');

        const timer = setInterval(() => {
            timeLeft--;
            const seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
            countdownEl.textContent = `00:${seconds}`;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownEl.style.display = 'none';
                resendBtn.removeAttribute('disabled');
                resendBtn.classList.add('text-primary');
            }
        }, 1000);
    </script>
</body></html>
