            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-lg antialiased">
<!-- Linear Flow: Suppressing Navigation Shells as per instructions -->
<main class="w-full max-w-md mx-auto min-h-screen flex flex-col relative overflow-hidden bg-surface-lowest">
<!-- Decorative Background Element -->
<div class="absolute top-[-10%] left-[-20%] w-[140%] h-[60%] bg-gradient-to-b from-primary-fixed-dim/30 to-transparent rounded-[100%] blur-3xl -z-10 pointer-events-none"></div>
<!-- Top AppBar (Simplified for Onboarding) -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full z-50">
<div class="font-display text-display text-primary tracking-tight">Zentra</div>
<button class="font-label-lg text-label-lg text-on-surface-variant hover:text-primary transition-colors">
                Skip
            </button>
</header>
<!-- Content Area -->
<div class="flex-1 flex flex-col justify-center px-margin-mobile py-lg pb-[120px] relative z-10">
<!-- Visual Hero Area -->
<div class="w-full aspect-square mb-xl relative rounded-3xl overflow-hidden flex items-center justify-center group">
<!-- Fallback gradient if image fails -->
<div class="absolute inset-0 bg-gradient-to-br from-surface-container to-primary-fixed opacity-50"></div>
<img alt="Security Illustration" class="w-full h-full object-cover relative z-10 transition-transform duration-700 ease-out group-hover:scale-105" data-alt="A modern, abstract 3D illustration symbolizing digital security and financial protection. Floating translucent shields and geometric data blocks arranged in a harmonious, balanced composition. The color palette features deep navy blues, crisp whites, and soft light blue accents, set against a pristine, light-mode background. The lighting is soft and studio-quality, creating a sense of trust, clarity, and advanced technology." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDiRbK3gSsojrDW-J_RK-5DhvZoyqcro28xerr-UHXiRYiXXYB2HHH-b-xMG9bgRBa9X71TdubXS2IhaK_0Wnc_w_C4gg25TIB-OQf0MOB7qFd8Vp-fOJVce1oAI8hSh8cciaMZoUdqZvD3HB57HTTQO7UEx7crXhxIbYNB8E1brTl51yg-1HvXizJowlV_Hm5BkGPs_EFICZBgHI_tFKlOEoF_bE34ntHH9l6dh1wzlJ8Ga0nx5a2j"/>

<div class="absolute bottom-6 right-6 glass-card rounded-2xl p-sm flex items-center gap-sm shadow-soft z-20 animate-[bounce_3s_ease-in-out_infinite]">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-sm text-label-sm text-primary">Checks complete</span>
</div>
</div>
<!-- Typography & Copy -->
<div class="flex flex-col gap-sm text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-primary">
                    Your Payments.<br/>Better Protected.
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                    Understand your financial activity clearly and respond to security incidents with professional-grade protection.
                </p>
</div>
</div>
<!-- Bottom Actions (Fixed) -->
<div class="absolute bottom-0 w-full px-margin-mobile pb-lg pt-md bg-gradient-to-t from-surface via-surface/90 to-transparent z-50">
<div class="flex flex-col gap-sm">
<button class="w-full h-12 rounded-lg bg-primary-container text-on-primary font-label-lg text-label-lg primary-btn-glow hover:opacity-90 transition-opacity active:scale-[0.98] flex items-center justify-center">
