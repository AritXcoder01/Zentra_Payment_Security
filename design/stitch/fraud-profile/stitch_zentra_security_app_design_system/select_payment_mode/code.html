<html lang="en"><head>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom radio button styles hidden for visual treatment */
        input[type="radio"] {
            display: none;
        }

        /* Selected state styling */
        input[type="radio"]:checked + div {
            border-color: #002f6c; /* primary-container */
            background-color: rgba(0, 47, 108, 0.05);
            box-shadow: 0px 4px 20px rgba(0, 47, 108, 0.1);
        }
        
        input[type="radio"]:checked + div .radio-indicator {
            border-color: #002f6c;
        }
        
        input[type="radio"]:checked + div .radio-indicator::after {
            content: '';
            display: block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #002f6c;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        /* Hide scrollbar for clean mobile feel if needed */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="bg-surface/90 text-primary font-headline-md text-headline-md docked full-width top-0 sticky z-50 backdrop-blur-md flex justify-between items-center px-margin-mobile h-16 w-full max-w-7xl mx-auto border-b border-outline-variant/30">
<!-- Back Button replacing Avatar for transactional flow -->
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant/50 transition-colors opacity-80 transition-opacity duration-150 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<span class="font-display text-display text-primary tracking-tight">Zentra</span>
<div class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant/50 transition-colors opacity-80 transition-opacity duration-150 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto no-scrollbar px-margin-mobile pt-lg pb-32">
<!-- Header Section -->
<div class="mb-lg">
<h1 class="font-headline-lg text-headline-lg text-primary mb-sm">How was the payment made?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Select the method you used to complete this transaction.</p>
</div>
<!-- Selection Grid -->
<form class="space-y-sm" id="payment-form">
<!-- UPI -->
<label class="block cursor-pointer group">
<input name="payment_mode" type="radio" value="upi"/>
<div class="flex items-center justify-between p-4 bg-surface-container-lowest border border-outline-variant/50 rounded-lg shadow-[0_4px_20px_rgba(0,47,108,0.02)] transition-all duration-200 hover:shadow-[0_4px_20px_rgba(0,47,108,0.05)]">
<div class="flex items-center gap-md">
<div class="w-12 h-12 bg-surface-container flex items-center justify-center rounded-full text-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">qr_code_scanner</span>
</div>
<div>
<h3 class="font-label-lg text-label-lg text-on-surface">UPI</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Google Pay, PhonePe, Paytm</p>
</div>
</div>
<div class="radio-indicator w-6 h-6 border-2 border-outline-variant rounded-full relative transition-colors duration-200 group-hover:border-primary-container/50"></div>
</div>
</label>
<!-- Bank Transfer -->
<label class="block cursor-pointer group">
<input name="payment_mode" type="radio" value="bank_transfer"/>
<div class="flex items-center justify-between p-4 bg-surface-container-lowest border border-outline-variant/50 rounded-lg shadow-[0_4px_20px_rgba(0,47,108,0.02)] transition-all duration-200 hover:shadow-[0_4px_20px_rgba(0,47,108,0.05)]">
<div class="flex items-center gap-md">
<div class="w-12 h-12 bg-surface-container flex items-center justify-center rounded-full text-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_balance</span>
</div>
<div>
<h3 class="font-label-lg text-label-lg text-on-surface">Bank Transfer</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">IMPS, NEFT, RTGS</p>
</div>
</div>
<div class="radio-indicator w-6 h-6 border-2 border-outline-variant rounded-full relative transition-colors duration-200 group-hover:border-primary-container/50"></div>
</div>
</label>
<!-- Debit/Credit Card -->
<label class="block cursor-pointer group">
<input name="payment_mode" type="radio" value="card"/>
<div class="flex items-center justify-between p-4 bg-surface-container-lowest border border-outline-variant/50 rounded-lg shadow-[0_4px_20px_rgba(0,47,108,0.02)] transition-all duration-200 hover:shadow-[0_4px_20px_rgba(0,47,108,0.05)]">
<div class="flex items-center gap-md">
<div class="w-12 h-12 bg-surface-container flex items-center justify-center rounded-full text-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">credit_card</span>
</div>
<div>
<h3 class="font-label-lg text-label-lg text-on-surface">Debit/Credit Card</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Visa, Mastercard, RuPay</p>
</div>
</div>
<div class="radio-indicator w-6 h-6 border-2 border-outline-variant rounded-full relative transition-colors duration-200 group-hover:border-primary-container/50"></div>
</div>
</label>
<!-- Net Banking -->
<label class="block cursor-pointer group">
<input name="payment_mode" type="radio" value="net_banking"/>
<div class="flex items-center justify-between p-4 bg-surface-container-lowest border border-outline-variant/50 rounded-lg shadow-[0_4px_20px_rgba(0,47,108,0.02)] transition-all duration-200 hover:shadow-[0_4px_20px_rgba(0,47,108,0.05)]">
<div class="flex items-center gap-md">
<div class="w-12 h-12 bg-surface-container flex items-center justify-center rounded-full text-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">language</span>
</div>
<div>
<h3 class="font-label-lg text-label-lg text-on-surface">Net Banking</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">All Indian banks</p>
</div>
</div>
<div class="radio-indicator w-6 h-6 border-2 border-outline-variant rounded-full relative transition-colors duration-200 group-hover:border-primary-container/50"></div>
</div>
</label>
<!-- Wallet -->
<label class="block cursor-pointer group">
<input name="payment_mode" type="radio" value="wallet"/>
<div class="flex items-center justify-between p-4 bg-surface-container-lowest border border-outline-variant/50 rounded-lg shadow-[0_4px_20px_rgba(0,47,108,0.02)] transition-all duration-200 hover:shadow-[0_4px_20px_rgba(0,47,108,0.05)]">
<div class="flex items-center gap-md">
<div class="w-12 h-12 bg-surface-container flex items-center justify-center rounded-full text-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">chevron_left</span>
</div>
<div>
<h3 class="font-label-lg text-label-lg text-on-surface">Wallet</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Amazon Pay, MobiKwik</p>
</div>
</div>
<div class="radio-indicator w-6 h-6 border-2 border-outline-variant rounded-full relative transition-colors duration-200 group-hover:border-primary-container/50"></div>
</div>
</label>
<!-- ATM -->
<label class="block cursor-pointer group">
<input name="payment_mode" type="radio" value="atm"/>
<div class="flex items-center justify-between p-4 bg-surface-container-lowest border border-outline-variant/50 rounded-lg shadow-[0_4px_20px_rgba(0,47,108,0.02)] transition-all duration-200 hover:shadow-[0_4px_20px_rgba(0,47,108,0.05)]">
<div class="flex items-center gap-md">
<div class="w-12 h-12 bg-surface-container flex items-center justify-center rounded-full text-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">local_atm</span>
</div>
<div>
<h3 class="font-label-lg text-label-lg text-on-surface">ATM</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Cash deposit at ATM</p>
</div>
</div>
<div class="radio-indicator w-6 h-6 border-2 border-outline-variant rounded-full relative transition-colors duration-200 group-hover:border-primary-container/50"></div>
</div>
</label>
<!-- Other -->
<label class="block cursor-pointer group">
<input name="payment_mode" type="radio" value="other"/>
<div class="flex items-center justify-between p-4 bg-surface-container-lowest border border-outline-variant/50 rounded-lg shadow-[0_4px_20px_rgba(0,47,108,0.02)] transition-all duration-200 hover:shadow-[0_4px_20px_rgba(0,47,108,0.05)]">
<div class="flex items-center gap-md">
<div class="w-12 h-12 bg-surface-container flex items-center justify-center rounded-full text-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">more_horiz</span>
</div>
<div>
<h3 class="font-label-lg text-label-lg text-on-surface">Other</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Alternative methods</p>
</div>
</div>
<div class="radio-indicator w-6 h-6 border-2 border-outline-variant rounded-full relative transition-colors duration-200 group-hover:border-primary-container/50"></div>
</div>
</label>
</form>
</main>
<!-- Bottom Action Bar (Contextual FAB Replacement for Transactional Flow) -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-gradient-to-t from-surface-bright via-surface-bright/90 to-transparent pb-safe">
<button class="w-full bg-primary-container text-on-primary h-12 rounded-lg font-label-lg text-label-lg flex items-center justify-center transition-all duration-200 opacity-50 cursor-not-allowed shadow-none" disabled="" id="continue-btn">
            Continue
        </button>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const radioButtons = document.querySelectorAll('input[name="payment_mode"]');
            const continueBtn = document.getElementById('continue-btn');

            radioButtons.forEach(radio => {
                radio.addEventListener('change', () => {
                    if (document.querySelector('input[name="payment_mode"]:checked')) {
                        continueBtn.disabled = false;
                        continueBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'shadow-none');
                        continueBtn.classList.add('shadow-[0_4px_12px_rgba(0,47,108,0.2)]', 'hover:bg-primary-container/90', 'active:scale-[0.98]');
                        
                        // Optional subtle glow effect
                        continueBtn.style.boxShadow = "inset 0 1px 0 rgba(255,255,255,0.1), 0 4px 12px rgba(0,47,108,0.2)";
                    }
                });
            });
        });
    </script>
</body></html>
