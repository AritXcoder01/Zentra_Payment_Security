<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .fade-in-up {
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .fade-in {
            animation: fadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .pulse-shield {
            animation: pulseShield 3s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes pulseShield {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(0, 47, 108, 0.1)); }
            100% { transform: scale(1.02); filter: drop-shadow(0 0 25px rgba(0, 47, 108, 0.2)); }
        }

        .bg-gradient-radial {
            background: radial-gradient(circle at center, var(--tw-gradient-from) 0%, var(--tw-gradient-to) 70%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface h-screen w-screen overflow-hidden flex flex-col justify-center items-center relative font-body-lg">
<!-- Subtle Background Gradient -->
<div class="absolute inset-0 bg-gradient-radial from-secondary-fixed/30 to-surface w-full h-full z-0"></div>
<!-- Main Content Container -->
<main class="z-10 flex flex-col items-center justify-center space-y-lg px-margin-mobile w-full max-w-md mx-auto">
<!-- Shield Icon Motif -->
<div class="fade-in pulse-shield relative w-32 h-32 flex items-center justify-center mb-md">
<!-- Glassmorphic backing with enhanced border -->
<div class="absolute inset-0 bg-surface/70 backdrop-blur-md rounded-full border border-primary-container/10 shadow-[0_8px_32px_rgba(0,47,108,0.08)]"></div>
<!-- Icon with premium styling -->
<span class="material-symbols-outlined text-[64px] text-primary z-10" style="font-variation-settings: 'FILL' 1;">
                verified_user
            </span>
<!-- Decorative security rings -->
<div class="absolute inset-2 rounded-full border border-primary-container/5 animate-pulse"></div>
<div class="absolute inset-4 rounded-full border border-primary-container/20"></div>
</div>
<!-- Brand Text -->
<div class="fade-in-up text-center flex flex-col space-y-xs" style="animation-delay: 0.2s;"><h1 class="font-display text-display text-primary tracking-tight mb-xs">
                Zentra
            </h1>
<h2 class="font-headline-md text-headline-md text-on-surface-variant font-medium opacity-80 tracking-wide">
                Payment Security
            </h2></div>
<!-- Progress/Loading Indicator (Conceptual for Splash) -->
<div class="fade-in absolute bottom-xl left-0 w-full flex justify-center" style="animation-delay: 0.8s;">
<div class="w-12 h-1 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-secondary rounded-full w-full animate-[progress_2s_ease-in-out_infinite]"></div>
</div>
</div>
</main>
<script>
        // Simple loading progress animation logic for the bar
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes progress {
                0% { transform: translateX(-100%); }
                50% { transform: translateX(0); }
                100% { transform: translateX(100%); }
            }
        `;
        document.head.appendChild(style);
        
        // Simulate splash screen timeout to next route (concept)
        // setTimeout(() => { window.location.href = '/dashboard'; }, 3000);
    </script>
</body></html>
