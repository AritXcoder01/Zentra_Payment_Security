<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Zentra - Incident Details</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#98cbff",
                        "on-tertiary": "#ffffff",
                        "primary": "#001b44",
                        "on-surface": "#191c1e",
                        "surface-container-low": "#f2f4f6",
                        "on-primary-fixed-variant": "#224583",
                        "on-secondary": "#ffffff",
                        "background": "#f7f9fb",
                        "surface-dim": "#d8dadc",
                        "on-secondary-fixed": "#001d33",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#e0e3e5",
                        "primary-container": "#002f6c",
                        "on-surface-variant": "#434750",
                        "primary-fixed": "#d8e2ff",
                        "on-background": "#191c1e",
                        "secondary-fixed": "#cfe5ff",
                        "on-primary-container": "#7999dc",
                        "on-secondary-container": "#003558",
                        "surface": "#f7f9fb",
                        "on-error": "#ffffff",
                        "surface-container": "#eceef0",
                        "on-error-container": "#93000a",
                        "tertiary": "#0c1f25",
                        "on-tertiary-fixed": "#0b1e24",
                        "inverse-surface": "#2d3133",
                        "inverse-primary": "#aec6ff",
                        "secondary": "#00629d",
                        "tertiary-fixed-dim": "#b6cad2",
                        "outline": "#747781",
                        "on-primary-fixed": "#001a42",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#004a77",
                        "secondary-container": "#00a2fd",
                        "outline-variant": "#c4c6d2",
                        "on-tertiary-container": "#899ca5",
                        "inverse-on-surface": "#eff1f3",
                        "surface-container-high": "#e6e8ea",
                        "error": "#ba1a1a",
                        "surface-tint": "#3c5d9c",
                        "surface-bright": "#f7f9fb",
                        "primary-fixed-dim": "#aec6ff",
                        "on-tertiary-fixed-variant": "#374951",
                        "tertiary-container": "#22343b",
                        "surface-container-highest": "#e0e3e5",
                        "tertiary-fixed": "#d2e6ef",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "gutter": "16px",
                        "sm": "8px",
                        "xs": "4px",
                        "lg": "24px",
                        "md": "16px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "otp-input": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "display": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500" }],
                        "otp-input": ["28px", { "lineHeight": "36px", "letterSpacing": "0.2em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0px 4px 20px rgba(0, 47, 108, 0.05);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar (Modified for internal screen - Back button instead of Avatar) -->
<header class="bg-surface/90 text-primary font-headline-md text-headline-md flex justify-between items-center px-margin-mobile h-16 w-full max-w-7xl mx-auto docked full-width top-0 sticky z-50 backdrop-blur-md border-b border-outline-variant/30 flat no shadows">
<div class="flex items-center gap-4">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/50 transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-display text-display text-primary tracking-tight">Incident Details</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/50 transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 w-full max-w-lg mx-auto px-margin-mobile py-lg pb-32">
<!-- Summary Cards -->
<div class="grid grid-cols-2 gap-sm mb-lg">
<div class="glass-card rounded-lg p-md">
<p class="font-label-sm text-label-sm text-on-surface-variant mb-xs">Fraud Type</p>
<p class="font-body-md text-body-md text-on-surface font-medium">UPI Phishing</p>
</div>
<div class="glass-card rounded-lg p-md">
<p class="font-label-sm text-label-sm text-on-surface-variant mb-xs">Payment Mode</p>
<p class="font-body-md text-body-md text-on-surface font-medium">UPI App</p>
</div>
</div>
<!-- Form -->
<form class="space-y-lg">
<!-- Amount Input -->
<div class="space-y-sm">
<label class="block font-label-lg text-label-lg text-on-surface" for="amount">Amount Lost</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="font-body-lg text-body-lg text-on-surface-variant">₹</span>
</div>
<input class="w-full pl-xl pr-md py-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="amount" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Date Input -->
<div class="space-y-sm">
<label class="block font-label-lg text-label-lg text-on-surface" for="date">Incident Date</label>
<div class="relative">
<input class="w-full px-md py-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="date" type="date"/>
</div>
</div>
<!-- Transaction Ref Input -->
<div class="space-y-sm">
<label class="block font-label-lg text-label-lg text-on-surface" for="ref">Transaction Reference <span class="font-body-md text-body-md text-on-surface-variant font-normal">(Optional)</span></label>
<input class="w-full px-md py-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="ref" placeholder="e.g. UPI Ref Number" type="text"/>
</div>
<!-- Description Input -->
<div class="space-y-sm">
<label class="block font-label-lg text-label-lg text-on-surface" for="desc">Description</label>
<textarea class="w-full px-md py-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none" id="desc" placeholder="Briefly describe what happened..." rows="4"></textarea>
</div>
</form>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface/95 backdrop-blur-lg border-t border-outline-variant/20 p-margin-mobile z-40 pb-[calc(20px+env(safe-area-inset-bottom))]">
<div class="max-w-lg mx-auto">
<!-- Safety Microcopy -->
<div class="flex items-start gap-sm mb-md p-sm bg-primary-fixed rounded-lg">
<span class="material-symbols-outlined text-primary-container text-lg" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
<p class="font-label-sm text-label-sm text-on-primary-container">
<strong>Zentra</strong> will never ask for your PIN, UPI PIN, CVV, password or OTP.
                </p>
</div>
<!-- CTA -->
<button class="w-full py-md bg-primary-container text-on-primary rounded-lg font-label-lg text-label-lg flex items-center justify-center gap-sm hover:bg-primary transition-colors shadow-[0_4px_12px_rgba(0,47,108,0.2)]">
                Continue
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</body></html>
