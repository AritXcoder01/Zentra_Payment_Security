<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- 
      TopAppBar (Task-focused adaptation)
      Uses JSON style keys: bg_color, component_shape, separation_logic, shell_layout, primary_color, typography
    -->
<header class="bg-surface/90 flex justify-between items-center px-margin-mobile h-16 w-full max-w-7xl mx-auto docked full-width top-0 sticky z-50 backdrop-blur-md border-b border-outline-variant/30">
<div class="flex items-center gap-md">
<!-- Back Button for sub-page -->
<button aria-label="Go back" class="text-primary hover:bg-surface-variant/50 p-2 -ml-2 rounded-full transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="text-primary font-headline-md text-headline-md">Edit Profile</h1>
</div>
<!-- Optional trailing action removed for focused task -->
<div></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-lg mx-auto px-margin-mobile pt-lg pb-[100px]">
<!-- Profile Photo Edit Section -->
<div class="flex flex-col items-center justify-center mb-xl relative">
<div class="relative group cursor-pointer">
<div class="w-24 h-24 rounded-full overflow-hidden border-2 border-surface-container-high shadow-[0_4px_20px_rgba(0,47,108,0.05)] bg-surface-container-low flex items-center justify-center">
<img alt="Profile Photo Placeholder" class="w-full h-full object-cover text-transparent" data-alt="A professional headshot of a person in a corporate modern setting, soft bright lighting, clean white and subtle navy blue background, high quality, realistic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCKVT4vKeqKp73S-WeWSaWruuOpayQNlN3f1gW4uTJuNlvhm1vWcKh7bJpnilo_8ArIhWN96G6g6lKCEs0FcPy_CS7H2-6VyKJiA21kRh3uO4MnL2bvIe3XNBS1glU-ey33RHiWcLWf9jxK17DhKsTQxtWbDFLxLVMrwkSVv1DzYlGYq5SuxoU_h4ysK1EXEtm7yFYAC7AkI2fWrJDfUW34Lui1I89E9cTjWt4RDohxRH_DW-kSm-55"/>
</div>
<!-- Edit Overlay -->
<div class="absolute bottom-0 right-0 bg-primary-container text-on-primary rounded-full w-8 h-8 flex items-center justify-center shadow-md border-2 border-surface ring-2 ring-transparent transition-transform hover:scale-105">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
</div>
<p class="mt-sm font-label-sm text-label-sm text-on-surface-variant">Tap to change</p>
</div>
<!-- Edit Form (Surface Card) -->
<form class="bg-surface-container-lowest rounded-xl border border-outline-variant/30 shadow-[0_4px_20px_rgba(0,47,108,0.02)] p-gutter flex flex-col gap-lg">
<!-- Editable Field: Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="fullName">Full Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="w-full h-14 pl-12 pr-4 rounded-lg border border-outline-variant/60 bg-surface focus:border-primary focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest outline-none transition-all font-body-md text-body-md text-on-surface" id="fullName" placeholder="Enter your full name" type="text" value="Sarah Jenkins"/>
</div>
</div>
<!-- Editable Field: Email Address -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="emailAddr">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full h-14 pl-12 pr-4 rounded-lg border border-outline-variant/60 bg-surface focus:border-primary focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest outline-none transition-all font-body-md text-body-md text-on-surface" id="emailAddr" placeholder="Enter your email" type="email" value="sarah.jenkins@example.com"/>
</div>
</div>
<hr class="border-outline-variant/20 my-xs"/>
<!-- Read-only Field: Mobile Number -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1 flex items-center gap-1" for="mobileNum">
                    Mobile Number 
                    <span class="material-symbols-outlined text-[14px] text-primary" style="font-variation-settings: 'FILL' 1;">verified</span>
</label>
<div class="relative flex items-center opacity-80">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">call</span>
<input class="w-full h-14 pl-12 pr-12 rounded-lg border border-outline-variant/40 bg-surface-container-low text-on-surface-variant font-body-md text-body-md cursor-not-allowed select-none focus:outline-none" id="mobileNum" readonly="" type="text" value="+91 98765 43210"/>
<span class="material-symbols-outlined absolute right-4 text-outline" style="font-variation-settings: 'FILL' 0;" title="Locked field">lock</span>
</div>
<p class="font-label-sm text-label-sm text-outline mt-1 leading-relaxed">
                    Your verified mobile number cannot be changed through profile settings.
                </p>
</div>
</form>
</main>
<!-- Fixed Bottom CTA Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface/95 backdrop-blur-lg border-t border-outline-variant/20 px-margin-mobile py-md pb-safe z-40 shadow-[0_-4px_20px_rgba(0,47,108,0.05)]">
<div class="max-w-lg mx-auto">
<button class="w-full h-12 bg-primary-container text-on-primary font-label-lg text-label-lg rounded-lg flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all shadow-md relative overflow-hidden group" type="button">

<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
</div>

    -->
